<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لا يوجد اتصال — AdLoop</title>
<style>
  /* صفحة ساكنة تماماً: تُعرض حين لا شبكة، فلا يمكنها تحميل خطّ ولا نمطاً
     خارجياً. كلّ شيء هنا داخليّ بالضرورة لا بالاختيار. */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    background: #F7F8FA; color: #171C27;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0E1116; color: #E8EBF0; }
    .card { background: #161A21 !important; border-color: #232830 !important; }
    .hint { color: #8B95A3 !important; }
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: #FFFFFF; border: 1px solid #E7EAEF; border-radius: 18px; padding: 32px 24px;
  }
  .mark {
    width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 13px;
    background: #4C8DFF; color: #fff; font-size: 22px; font-weight: 700;
    display: grid; place-items: center;
  }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  p { margin: 0 0 20px; font-size: 14px; line-height: 1.75; color: #5C6478; }
  .hint { font-size: 12px; color: #8B95A3; margin: 14px 0 0; line-height: 1.7; }
  button {
    width: 100%; padding: 13px 20px; border: 0; border-radius: 12px;
    background: #4C8DFF; color: #fff; font-size: 14.5px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">A</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <!-- الصدق هنا مقصود: منتج جوهره التحقّق من الأرقام لا يعرض نسخة
         مخزَّنة منها ويسمّيها حاضرة. -->
    <p>لا نعرض لك أرقاماً محفوظة من زيارة سابقة — رقم قديم يبدو حاضراً أسوأ من غيابه.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <p class="hint">تعود الصفحة تلقائياً بمجرّد رجوع الاتصال.</p>
  </div>
<script>
  // العودة التلقائية: المستخدم لا يحتاج أن يتذكّر الضغط.
  addEventListener("online", () => location.reload());
</script>
</body>
</html>
